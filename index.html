
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAP POWER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:#fff;font-family:Arial,sans-serif;transition:.2s}
body.light{background:#f1f3fa;color:#172033}
header{text-align:center;padding:25px;background:#202a49}
h1{margin:0;color:#61e5ff;font-size:34px}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:15px}
button,select,input{font:inherit;border:0;border-radius:12px;padding:12px}
button{background:#39466b;color:white;font-weight:bold;cursor:pointer}
button.active{background:#00a9c7}
button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:700px;margin:auto;padding:12px}
.page{display:none}
.page.show{display:block}
.panel{background:#202a49;padding:22px;border-radius:20px;margin:14px 0;text-align:center}
.light .panel{background:white}
.big{font-size:64px;font-weight:bold;color:#61e5ff;margin:20px}
.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
input,select{background:#11182c;color:white;margin:5px}
.light input,.light select{background:#e8ebf4;color:#172033}
#tapArea{width:100%;height:180px;margin-top:18px;font-size:30px;background:linear-gradient(135deg,#00b8d4,#735cff);touch-action:manipulation}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{padding:12px;border-bottom:1px solid #65708a}
footer{text-align:center;padding:25px;opacity:.5}
</style>
</head>
<body>
<header>
<h1>TAP POWER</h1>
<div>連打力測定 ＆ ストップウォッチ</div>
</header>

<nav>
<button class="active" onclick="page('tap',this)">連打測定</button>
<button onclick="page('ranking',this)">ランキング</button>
<button onclick="page('watch',this)">ストップウォッチ</button>
<button onclick="theme()">🌙 / ☀</button>
</nav>

<main>
<section id="tap" class="page show">
<div class="panel">
<h2>連打力測定</h2>
<div class="modes">
<button class="active" onclick="choose(5,this)">5秒</button>
<button onclick="choose(10,this)">10秒</button>
<button onclick="choose(30,this)">30秒</button>
<button onclick="choose(60,this)">60秒</button>
</div>
<div class="big" id="count">0</div>
<div>回数</div>
<div class="big" id="timer">5.00</div>
<div id="status">スタートを押してください</div>
<p><button id="start" onclick="start()">スタート</button>
<button onclick="reset()">リセット</button></p>
<button id="tapArea" disabled>ここを連打！</button>
</div>
<div class="panel">
<h3>記録を登録</h3>
<input id="nickname" maxlength="16" placeholder="ニックネーム">
<br>
<button id="submit" onclick="save()" disabled>ランキングに登録</button>
<div id="message"></div>
</div>
</section>

<section id="ranking" class="page">
<div class="panel">
<h2>🏆 オンラインランキング</h2>
<select id="rankDuration" onchange="loadRanking()">
<option value="5">5秒</option>
<option value="10">10秒</option>
<option value="30">30秒</option>
<option value="60">60秒</option>
</select>
<button onclick="loadRanking()">更新</button>
<p id="rankStatus">ランキングを読み込みます</p>
<table>
<thead><tr><th>順位</th><th>名前</th><th>回数</th></tr></thead>
<tbody id="rankRows"></tbody>
</table>
</div>
</section>

<section id="watch" class="page">
<div class="panel">
<h2>ストップウォッチ</h2>
<div class="big" id="watchDisplay">00:00.00</div>
<button onclick="watchStart()">スタート</button>
<button onclick="watchStop()">ストップ</button>
<button onclick="lap()">ラップ</button>
<button onclick="watchReset()">リセット</button>
<h3>ラップ記録</h3>
<div id="laps"></div>
</div>
</section>
</main>
<footer>TAP POWER</footer>

<script>
// オンラインランキングAPIのURLを設定
const API_URL="https://YOUR-API-SERVICE.onrender.com";

let duration=5,count=0,running=false,finished=false;
let startTime=0,timer=null,lastScore=null;
const area=document.getElementById("tapArea");

function page(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("show"));
 document.getElementById(id).classList.add("show");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 if(id==="ranking")loadRanking();
}
function theme(){document.body.classList.toggle("light")}

function choose(n,btn){
 if(running)return;
 duration=n;
 document.querySelectorAll(".modes button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 reset();
}

function reset(){
 clearInterval(timer);
 running=false;finished=false;count=0;lastScore=null;
 document.getElementById("count").textContent="0";
 document.getElementById("timer").textContent=duration.toFixed(2);
 document.getElementById("status").textContent="スタートを押してください";
 document.getElementById("start").disabled=false;
 document.getElementById("submit").disabled=true;
 document.getElementById("message").textContent="";
 area.disabled=true;area.textContent="ここを連打！";
}

function start(){
 if(running)return;
 reset();
 document.getElementById("start").disabled=true;
 let n=3;
 document.getElementById("status").textContent="3";
 const cd=setInterval(()=>{
  n--;
  if(n>0){document.getElementById("status").textContent=n;return}
  if(n===0){document.getElementById("status").textContent="GO!";return}
  clearInterval(cd);
  begin();
 },1000);
}

function begin(){
 running=true;finished=false;count=0;
 startTime=performance.now();
 area.disabled=false;area.textContent="TAP!";
 document.getElementById("status").textContent="連打中！";
 timer=setInterval(()=>{
  let left=Math.max(0,duration-(performance.now()-startTime)/1000);
  document.getElementById("timer").textContent=left.toFixed(2);
  if(left<=0)finish();
 },20);
}

area.addEventListener("pointerdown",e=>{
 if(!running)return;
 e.preventDefault();
 count++;
 document.getElementById("count").textContent=count;
});

function finish(){
 if(!running)return;
 running=false;finished=true;clearInterval(timer);
 lastScore=count;
 area.disabled=true;area.textContent="終了！";
 document.getElementById("timer").textContent="0.00";
 document.getElementById("status").textContent=`結果：${count}回`;
 document.getElementById("start").disabled=false;
 document.getElementById("submit").disabled=false;
}

async function save(){
 if(!finished||lastScore===null)return;
 const name=document.getElementById("nickname").value.trim();
 if(!name){alert("ニックネームを入力してください");return}
 const btn=document.getElementById("submit");
 btn.disabled=true;
 try{
  const r=await fetch(API_URL+"/scores",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,score:lastScore,duration})
  });
  if(!r.ok)throw Error();
  document.getElementById("message").textContent="登録しました！";
 }catch(e){
  document.getElementById("message").textContent="登録できません。API設定を確認してください。";
  btn.disabled=false;
 }
}

async function loadRanking(){
 const rows=document.getElementById("rankRows");
 const status=document.getElementById("rankStatus");
 rows.innerHTML="";
 status.textContent="読み込み中...";
 const d=document.getElementById("rankDuration").value;
 try{
  const r=await fetch(`${API_URL}/scores?duration=${d}`);
  if(!r.ok)throw Error();
  const data=await r.json();
  if(!data.length){status.textContent="まだ記録がありません";return}
  status.textContent=`${d}秒ランキング`;
  data.forEach((v,i)=>{
   const tr=document.createElement("tr");
   [i+1,v.name,v.score].forEach(x=>{
    const td=document.createElement("td");
    td.textContent=x;
    tr.appendChild(td);
   });
   rows.appendChild(tr);
  });
 }catch(e){
  status.textContent="ランキングサーバーに接続できません";
 }
}

// ストップウォッチ
let watchRunning=false,watchBase=0,watchStartAt=0,frame=null;
function format(ms){
 let m=Math.floor(ms/60000);
 let s=Math.floor(ms/1000)%60;
 let cs=Math.floor(ms%1000/10);
 return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(cs).padStart(2,"0")}`;
}
function watchTick(){
 if(!watchRunning)return;
 document.getElementById("watchDisplay").textContent=format(watchBase+performance.now()-watchStartAt);
 frame=requestAnimationFrame(watchTick);
}
function watchStart(){
 if(watchRunning)return;
 watchRunning=true;watchStartAt=performance.now();watchTick();
}
function watchStop(){
 if(!watchRunning)return;
 watchBase+=performance.now()-watchStartAt;
 watchRunning=false;cancelAnimationFrame(frame);
 document.getElementById("watchDisplay").textContent=format(watchBase);
}
function lap(){
 if(!watchRunning&&!watchBase)return;
 let value=watchBase+(watchRunning?performance.now()-watchStartAt:0);
 let div=document.createElement("div");
 div.textContent=`ラップ ${document.getElementById("laps").children.length+1}：${format(value)}`;
 document.getElementById("laps").prepend(div);
}
function watchReset(){
 watchStop();watchBase=0;
 document.getElementById("watchDisplay").textContent="00:00.00";
 document.getElementById("laps").innerHTML="";
}
</script>
</body>
</html>
